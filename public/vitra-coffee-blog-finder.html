<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find My Coffee Blog</title>
  <style>
    :root {
      --bg: #fcfbfa;
      --ink: #111111;
      --muted: #6f6a64;
      --line: #111111;
      --soft: #f7f5f2;
      --paper: #ffffff;
      --wash: #efede9;
      --timing: 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(rgba(17, 17, 17, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 17, 17, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 34px 34px;
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        Arial, sans-serif;
      letter-spacing: 0;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    .progress-shell {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      width: 100%;
      height: 4px;
      background: var(--wash);
    }

    .progress-bar {
      width: 33.333%;
      height: 100%;
      background: var(--ink);
      transition: width 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .site-header {
      position: fixed;
      top: 4px;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px clamp(20px, 4vw, 56px);
      pointer-events: none;
    }

    .brand,
    .step-state {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: rgba(252, 251, 250, 0.88);
      padding: 10px 13px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 116px clamp(20px, 5vw, 72px) 56px;
    }

    .stage {
      width: min(920px, 100%);
      min-height: 560px;
      position: relative;
      display: grid;
      align-items: center;
    }

    .panel {
      width: min(680px, 100%);
      margin: 0 auto;
      transition:
        opacity var(--timing),
        transform var(--timing);
    }

    .panel.is-exiting {
      opacity: 0;
      transform: translateY(18px);
    }

    .kicker {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .question-title {
      max-width: 760px;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 520;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .question-subtitle {
      max-width: 540px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 46px;
    }

    .option-button {
      display: grid;
      grid-template-columns: 92px 1fr 28px;
      align-items: center;
      gap: 22px;
      min-height: 116px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      background: rgba(255, 255, 255, 0.68);
      color: var(--ink);
      padding: 20px 22px;
      text-align: left;
      cursor: pointer;
      transition:
        background var(--timing),
        transform var(--timing),
        border-color var(--timing);
    }

    .option-button:hover,
    .option-button:focus-visible {
      background: var(--paper);
      transform: translateY(-2px);
      outline: none;
    }

    .option-button:focus-visible {
      box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.14);
    }

    .option-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .option-icon svg,
    .result-art svg {
      width: 54px;
      height: 54px;
      stroke: var(--ink);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option-title {
      display: block;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 560;
      line-height: 1.22;
    }

    .option-desc {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .arrow {
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      opacity: 0.35;
      transform: translateX(-4px);
      transition:
        opacity var(--timing),
        transform var(--timing);
    }

    .option-button:hover .arrow,
    .option-button:focus-visible .arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .controls {
      min-height: 40px;
      margin-top: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-button,
    .restart-button {
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 6px 0;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        color var(--timing),
        border-color var(--timing);
    }

    .back-button:hover,
    .back-button:focus-visible,
    .restart-button:hover,
    .restart-button:focus-visible {
      color: var(--ink);
      border-color: var(--ink);
      outline: none;
    }

    .result-panel {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding-top: 12px;
    }

    .result-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    .result-title {
      max-width: 720px;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 520;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .result-copy {
      max-width: 560px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .result-card {
      display: flex;
      min-height: 440px;
      flex-direction: column;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      transition:
        transform var(--timing),
        background var(--timing),
        box-shadow var(--timing);
    }

    .result-card:hover,
    .result-card:focus-visible {
      background: #fff;
      transform: translateY(-4px);
      box-shadow: 8px 8px 0 var(--ink);
      outline: none;
    }

    .result-art {
      display: grid;
      min-height: 210px;
      place-items: center;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .result-art svg {
      width: 118px;
      height: 118px;
    }

    .result-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 24px;
    }

    .tagline {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .coffee-name {
      font-size: 24px;
      font-weight: 560;
      line-height: 1.2;
    }

    .coffee-desc {
      margin-top: 14px;
      color: #3c3935;
      font-size: 14px;
      line-height: 1.75;
    }

    .read-link {
      margin-top: auto;
      padding-top: 28px;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 42px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    @media (max-width: 920px) {
      .site-header {
        padding: 18px 20px;
      }

      .app {
        align-items: start;
        padding-top: 104px;
      }

      .stage {
        min-height: auto;
      }

      .option-button {
        grid-template-columns: 76px 1fr 24px;
        gap: 16px;
        min-height: 106px;
        padding: 18px;
      }

      .option-icon {
        width: 62px;
        height: 62px;
      }

      .option-icon svg {
        width: 46px;
        height: 46px;
      }

      .result-head {
        align-items: start;
        flex-direction: column;
      }

      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .brand,
      .step-state {
        padding: 9px 10px;
        font-size: 10px;
      }

      .app {
        padding-left: 16px;
        padding-right: 16px;
      }

      .question-title,
      .result-title {
        font-size: 34px;
      }

      .options {
        margin-top: 34px;
      }

      .option-button {
        grid-template-columns: 1fr 22px;
      }

      .option-icon {
        grid-column: 1 / -1;
        width: 68px;
        height: 68px;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .result-card {
        min-height: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="progress-shell" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <header class="site-header" aria-label="Coffee blog finder header">
    <div class="brand">Find My Coffee</div>
    <div class="step-state" id="stepState">01 / 03</div>
  </header>

  <main class="app">
    <section class="stage" id="appStage" aria-live="polite"></section>
  </main>

  <script>
    const iconStroke = 'stroke="#111111" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';

    const icons = {
      sun: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="10" ${iconStroke}></circle>
          <path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l5.6 5.6M43.4 43.4 49 49M49 15l-5.6 5.6M20.6 43.4 15 49" ${iconStroke}></path>
        </svg>
      `,
      cup: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M18 29h26v10a12 12 0 0 1-12 12h-2a12 12 0 0 1-12-12V29Z" ${iconStroke}></path>
          <path d="M44 33h5a5 5 0 0 1 0 10h-5M16 54h32M25 20c-2-3 2-5 0-8M33 20c-2-3 2-5 0-8M41 20c-2-3 2-5 0-8" ${iconStroke}></path>
        </svg>
      `,
      flower: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="4" ${iconStroke}></circle>
          <path d="M32 17c5 5 5 10 0 15-5-5-5-10 0-15ZM32 47c-5-5-5-10 0-15 5 5 5 10 0 15ZM17 32c5-5 10-5 15 0-5 5-10 5-15 0ZM47 32c-5 5-10 5-15 0 5-5 10-5 15 0Z" ${iconStroke}></path>
          <path d="M21.4 21.4c7 0 10.5 3.5 10.6 10.6-7 0-10.5-3.5-10.6-10.6ZM42.6 42.6c-7 0-10.5-3.5-10.6-10.6 7 0 10.5 3.5 10.6 10.6Z" ${iconStroke}></path>
        </svg>
      `,
      bean: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M42.7 12.5c10 6.1 9 22.5-1.1 34.1C31.3 58.5 17.2 56.7 12.3 47.4 7.5 38.1 12.8 22 23.8 14.3c6.2-4.4 13.5-5.1 18.9-1.8Z" ${iconStroke}></path>
          <path d="M24.7 15.5c7.2 5.7 6.6 12.6 1.4 18.7-4.4 5.2-5.5 10.3 1.8 16.2" ${iconStroke}></path>
        </svg>
      `,
      pourover: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M20 18h24l-5 21H25l-5-21Z" ${iconStroke}></path>
          <path d="M25 39h14l5 12H20l5-12ZM18 18h28M27 24h10M29 30h6" ${iconStroke}></path>
          <path d="M44 44h4a4 4 0 0 1 0 8h-4" ${iconStroke}></path>
          <path d="M36 10c2.5 2.4 6 2.9 9 1.1" ${iconStroke}></path>
        </svg>
      `,
      espresso: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M16 12h32v28H16V12Z" ${iconStroke}></path>
          <path d="M22 18h20M25 40v8M39 40v8M20 52h24M25 28h14M39 28h9" ${iconStroke}></path>
          <path d="M28 28v7M34 28v7M22 48h20" ${iconStroke}></path>
        </svg>
      `,
      moka: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M24 10h16l3 13H21l3-13ZM21 23h22l-4 31H25L21 23Z" ${iconStroke}></path>
          <path d="M23 34h18M43 30h5c3 0 5 2 5 5v6c0 3-2 5-5 5h-7M28 16h8" ${iconStroke}></path>
        </svg>
      `,
      cold: `
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M22 17h20l-3 37H25L22 17Z" ${iconStroke}></path>
          <path d="M20 17h24M24 28h16M27 35l4 4M37 35l-4 4M32 11V5M27 8l5 3 5-3" ${iconStroke}></path>
        </svg>
      `
    };

    const questionFlow = [
      {
        step: '01 / 03',
        key: 'scene',
        title: '你希望这篇咖啡文章陪你进入什么状态？',
        subtitle: '先从阅读心境开始。清晨需要一个直接、清醒的入口；午后则更适合慢慢展开风味和故事。',
        options: [
          {
            value: 'morning',
            title: '清晨提神',
            desc: '明快、有结构，像第一口咖啡把注意力拉回来。',
            icon: icons.sun
          },
          {
            value: 'afternoon',
            title: '午后品鉴',
            desc: '更松弛，适合读一篇有风味、有细节的长文章。',
            icon: icons.cup
          }
        ]
      },
      {
        step: '02 / 03',
        key: 'flavor',
        title: '你更想进入哪一种风味叙事？',
        subtitle: '咖啡风味在这里不是商品参数，而是博客主题的语言。它决定文章是明亮、轻盈，还是深沉、厚实。',
        options: [
          {
            value: 'fruity',
            title: '明亮花果酸',
            desc: '适合读产区、处理法、酸质和香气层次的内容。',
            icon: icons.flower
          },
          {
            value: 'nutty',
            title: '醇厚巧克力坚果',
            desc: '适合读拼配、烘焙、奶咖和日常稳定风味。',
            icon: icons.bean
          }
        ]
      },
      {
        step: '03 / 03',
        key: 'method',
        title: '你想从哪种冲煮方式切入？',
        subtitle: '器具决定文章的技术密度。手冲更像慢慢拆解，意式更像进入压力、萃取和效率。',
        options: [
          {
            value: 'filter',
            title: '精致手冲滤杯',
            desc: '关注水温、研磨、粉水比，以及一杯清晰咖啡背后的变量。',
            icon: icons.pourover
          },
          {
            value: 'espresso',
            title: '意式浓缩机',
            desc: '关注油脂、萃取压力、奶咖结构，以及浓缩咖啡的判断标准。',
            icon: icons.espresso
          }
        ]
      }
    ];

    const coffeeDatabase = [
      {
        id: 'yirgacheffe-field-notes',
        name: '耶加雪菲田野笔记',
        scene: 'afternoon',
        flavor: 'fruity',
        method: 'filter',
        tag: 'Origin / Pour-over / Floral',
        desc: '从水洗与日晒的差异开始，拆解柑橘、茉莉和茶感如何变成一篇可以慢慢读完的产区故事。',
        link: '/stories/why-one-cup',
        icon: icons.pourover
      },
      {
        id: 'kenya-bright-structure',
        name: '肯尼亚 AA 的明亮结构',
        scene: 'morning',
        flavor: 'fruity',
        method: 'filter',
        tag: 'Acidity / Blackcurrant / Focus',
        desc: '一篇关于高酸咖啡为什么会让人清醒的评测：黑加仑、乌梅和清爽收尾如何建立清晨节奏。',
        link: '/stories/why-one-cup',
        icon: icons.flower
      },
      {
        id: 'espresso-crema-lab',
        name: '意式油脂实验室',
        scene: 'morning',
        flavor: 'nutty',
        method: 'espresso',
        tag: 'Espresso / Crema / Milk',
        desc: '从浓缩萃取到拿铁口感，记录一杯低酸、厚重、带可可感的咖啡如何成为最直接的早晨入口。',
        link: '/stories/toronto-online',
        icon: icons.espresso
      },
      {
        id: 'huila-slow-afternoon',
        name: '蕙兰的慢下午',
        scene: 'afternoon',
        flavor: 'nutty',
        method: 'filter',
        tag: 'Caramel / Balance / Daily Cup',
        desc: '不追求夸张风味，而是观察坚果、焦糖、轻微酸质如何组成一篇温和但不无聊的日常咖啡文章。',
        link: '/stories/fuzhou-summer-route',
        icon: icons.bean
      },
      {
        id: 'moka-chocolate-route',
        name: '摩卡壶巧克力路线',
        scene: 'morning',
        flavor: 'nutty',
        method: 'espresso',
        tag: 'Moka / Chocolate / Dense',
        desc: '用更家庭化的器具理解意式逻辑：压力不一定来自机器，也可以来自一个很小的壶和很强的风味。',
        link: '/stories/toronto-online',
        icon: icons.moka
      },
      {
        id: 'cold-brew-walk',
        name: '冷萃散步阅读',
        scene: 'afternoon',
        flavor: 'fruity',
        method: 'filter',
        tag: 'Cold Brew / Summer / Clean',
        desc: '适合在福州或多伦多夏天打开的一篇：冰感、干净甜感和城市散步如何被放进同一个咖啡主题。',
        link: '/stories/fuzhou-summer-route',
        icon: icons.cold
      }
    ];

    const state = {
      step: 0,
      answers: {}
    };

    const stage = document.getElementById('appStage');
    const progressBar = document.getElementById('progressBar');
    const stepState = document.getElementById('stepState');

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateProgress(isResult = false) {
      const percent = isResult ? 100 : ((state.step + 1) / questionFlow.length) * 100;
      progressBar.style.width = `${percent}%`;
      stepState.textContent = isResult ? 'Result' : questionFlow[state.step].step;
    }

    function transitionTo(nextRender) {
      const currentPanel = stage.querySelector('.panel, .result-panel');
      if (!currentPanel) {
        nextRender();
        return;
      }

      currentPanel.classList.add('is-exiting');
      window.setTimeout(nextRender, 220);
    }

    function selectAnswer(key, value) {
      state.answers[key] = value;
      const isLast = state.step === questionFlow.length - 1;

      transitionTo(() => {
        if (isLast) {
          renderResults();
          return;
        }

        state.step += 1;
        renderQuestion();
      });
    }

    function goBack() {
      if (state.step === 0) return;
      transitionTo(() => {
        state.step -= 1;
        renderQuestion();
      });
    }

    function restart() {
      transitionTo(() => {
        state.step = 0;
        state.answers = {};
        renderQuestion();
      });
    }

    function renderQuestion() {
      const question = questionFlow[state.step];
      updateProgress(false);

      stage.innerHTML = `
        <section class="panel" aria-labelledby="questionTitle">
          <p class="kicker">${question.step}</p>
          <h1 class="question-title" id="questionTitle">${escapeHTML(question.title)}</h1>
          <p class="question-subtitle">${escapeHTML(question.subtitle)}</p>

          <div class="options">
            ${question.options.map((option) => `
              <button class="option-button" type="button" data-key="${question.key}" data-value="${option.value}">
                <span class="option-icon">${option.icon}</span>
                <span>
                  <span class="option-title">${escapeHTML(option.title)}</span>
                  <span class="option-desc">${escapeHTML(option.desc)}</span>
                </span>
                <span class="arrow" aria-hidden="true">→</span>
              </button>
            `).join('')}
          </div>

          <div class="controls">
            ${state.step > 0 ? '<button class="back-button" type="button" id="backButton">← Back</button>' : '<span></span>'}
            <span></span>
          </div>
        </section>
      `;

      stage.querySelectorAll('.option-button').forEach((button) => {
        button.addEventListener('click', () => {
          selectAnswer(button.dataset.key, button.dataset.value);
        });
      });

      const backButton = document.getElementById('backButton');
      if (backButton) backButton.addEventListener('click', goBack);
    }

    function scoreCoffee(item) {
      let score = 0;
      if (item.scene === state.answers.scene) score += 3;
      if (item.flavor === state.answers.flavor) score += 3;
      if (item.method === state.answers.method) score += 3;
      return score;
    }

    function findMatches() {
      const exact = coffeeDatabase.filter((item) => {
        return (
          item.scene === state.answers.scene &&
          item.flavor === state.answers.flavor &&
          item.method === state.answers.method
        );
      });

      if (exact.length > 0) return exact;

      const ranked = coffeeDatabase
        .map((item) => ({ item, score: scoreCoffee(item) }))
        .sort((a, b) => b.score - a.score);
      const bestScore = ranked[0] ? ranked[0].score : 0;
      return ranked.filter((entry) => entry.score === bestScore).map((entry) => entry.item);
    }

    function renderResults() {
      updateProgress(true);
      const matches = findMatches();

      stage.innerHTML = `
        <section class="result-panel" aria-labelledby="resultTitle">
          <div class="result-head">
            <div>
              <p class="kicker">Matched Coffee Topics</p>
              <h2 class="result-title" id="resultTitle">这些咖啡主题最接近你现在想读的内容。</h2>
              <p class="result-copy">每张卡片都是博客入口。它不是在卖咖啡，而是在帮你选择一个故事线、一个评测角度，或者一个适合今天心情的阅读主题。</p>
            </div>
            <button class="restart-button" type="button" id="restartButton">Restart</button>
          </div>

          <div class="result-grid">
            ${matches.length === 0 ? `
              <div class="empty-state">暂时没有匹配内容。你可以重新选择一次，或者把这里接入真实博客数据库。</div>
            ` : matches.map((coffee) => `
              <a class="result-card" href="${escapeHTML(coffee.link)}" target="_blank" rel="noopener noreferrer">
                <div class="result-art">${coffee.icon}</div>
                <div class="result-body">
                  <p class="tagline">${escapeHTML(coffee.tag)}</p>
                  <h3 class="coffee-name">${escapeHTML(coffee.name)}</h3>
                  <p class="coffee-desc">${escapeHTML(coffee.desc)}</p>
                  <p class="read-link">Open Article →</p>
                </div>
              </a>
            `).join('')}
          </div>
        </section>
      `;

      document.getElementById('restartButton').addEventListener('click', restart);
    }

    renderQuestion();
  </script>
</body>
</html>
